[project]
name = "downloads-organizer"
version = "0.1.0"
description = "Organize Downloads based on MIME type"
readme = "README.md"
authors = [{ name = "Lexington", email = "elsie.buchholz@proton.me" }]
requires-python = ">=3.14"
dependencies = ["python-magic>=0.4.27"]

[project.scripts]
downloads-organizer = "downloads_organizer.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.16.9"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
